<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>글쓰기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="/" class="nav-logo">📝 MyBlog</a>
      <a href="/" class="btn btn--outline">← 목록으로</a>
    </div>
  </nav>

  <div class="page-wrapper">

    <div class="page-header">
      <div class="badge badge--green">NEW POST</div>
      <h1>새 글 작성</h1>
    </div>

    <div class="card" style="max-width:680px; width:100%;">
      <form action="/submit" method="POST">

        <div class="field">
          <label class="field-label">제목 <span class="req">*</span></label>
          <input class="input" type="text" name="title" placeholder="게시물 제목을 입력하세요" required />
        </div>

        <div class="field-row">
          <div class="field">
            <label class="field-label">작성자 <span class="req">*</span></label>
            <input class="input" type="text" name="author" placeholder="닉네임" required />
          </div>
          <div class="field">
            <label class="field-label">카테고리</label>
            <select class="input select" name="category">
              <option value="일반">일반</option>
              <option value="여행">여행</option>
              <option value="음식">음식</option>
              <option value="IT">IT</option>
              <option value="일상">일상</option>
              <option value="기타">기타</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label class="field-label">내용 <span class="req">*</span></label>
          <textarea class="input textarea" name="content" placeholder="자유롭게 내용을 작성해주세요..." style="min-height:280px;" required></textarea>
        </div>

        <button type="submit" class="btn btn--primary btn--full">게시물 등록 →</button>
      </form>
    </div>

  </div>

</body>
</html>
